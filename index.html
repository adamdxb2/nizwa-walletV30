<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a2647">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nizwa">
<title>Nizwa</title>
<style>
:root{--bg:#0a1628;--bg-grad:radial-gradient(ellipse at 20% -10%,#123a5c 0%,#0a2647 45%,#051020 100%);--field:rgba(255,255,255,.06);--text:#f0f4f8;--muted:#8ba3bf;--line:rgba(255,255,255,.08);--primary:#0d6efd;--primary-dark:#0a58ca;--primary-light:#4d9dff;--teal:#00a8a8;--teal-dark:#007a7a;--gold:#d4af37;--success:#10b981;--error:#ef4444;--warning:#f59e0b;--glass:rgba(255,255,255,.04);--glass-strong:rgba(255,255,255,.08);--border:rgba(255,255,255,.1);--shadow:0 6px 24px rgba(0,0,0,.5);--grad:linear-gradient(135deg,#0d6efd 0%,#0a2647 100%);--grad-teal:linear-gradient(135deg,#00d4d4 0%,#007a7a 100%);--grad-gold:linear-gradient(135deg,#e6c869 0%,#b8941f 100%);--eo:cubic-bezier(.16,1,.3,1);--es:cubic-bezier(.34,1.56,.64,1)}
html[data-theme="light"]{--bg:#f0f4f8;--bg-grad:radial-gradient(ellipse at 20% -10%,#e6f0ff 0%,#d4e4f5 45%,#c5d8eb 100%);--field:rgba(13,110,253,.05);--text:#0a1628;--muted:#5a7186;--line:rgba(13,110,253,.12);--glass:rgba(255,255,255,.75);--glass-strong:rgba(255,255,255,.92);--border:rgba(255,255,255,.9);--shadow:0 6px 24px rgba(10,38,71,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .18s var(--es),opacity .15s}
button:disabled{opacity:.4;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.96)}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:16px;caret-color:var(--primary)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(13,110,253,.15)}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0 0 12px}h1{font-size:26px;font-weight:800;letter-spacing:-.5px}h2{font-size:17px;font-weight:700}h3{font-size:14px;font-weight:700}p{line-height:1.6}
small,.muted{color:var(--muted)}small{font-size:12px;line-height:1.6}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.app{max-width:520px;margin:auto;min-height:100vh;position:relative}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border)}
header .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.3px}
header .brand .logo{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--grad-teal);color:#fff;box-shadow:0 4px 12px rgba(0,168,168,.35)}
header .brand .logo svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4}
header .right{display:flex;gap:9px;align-items:center}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--glass-strong);display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;flex-shrink:0}
.icon:active{transform:scale(.88)}
.icon .badge-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--error);border:2px solid var(--bg)}
.avatar{background:var(--grad-teal);color:#fff;font-weight:800;border:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.omr-badge{display:inline-flex;align-items:center;gap:6px;background:var(--glass-strong);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800}
.omr-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
main{padding:14px 18px calc(120px + env(safe-area-inset-bottom,0px));animation:pageIn .32s var(--eo)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{position:relative;border:1px solid var(--border);border-radius:20px;padding:18px;background:var(--glass);box-shadow:var(--shadow);margin-bottom:12px;overflow-wrap:anywhere}
.hello h1{margin-bottom:2px}.hello p{margin-bottom:16px}
.main-account{border-radius:20px;padding:18px;margin:6px 0 12px;background:linear-gradient(145deg,#0a2647 0%,#134d7a 50%,#0d6efd 100%);color:#fff;overflow:hidden;box-shadow:0 16px 40px rgba(13,110,253,.35);position:relative}
.main-account::after{content:"";position:absolute;top:-50%;right:-30%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,212,.3),transparent 70%);pointer-events:none}
.ma-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:1}
.ma-label{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.75)}
.ma-num{font-size:12px;font-weight:700;font-family:ui-monospace,monospace;letter-spacing:1px}
.ma-eye{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center}
.ma-eye svg{width:16px;height:16px}
.ma-balance-label{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700;margin-bottom:4px}
.ma-balance{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;margin-bottom:16px;position:relative;z-index:1;transition:opacity .35s,transform .35s var(--es)}
.ma-balance.hidden-state{opacity:.5;transform:scale(.98)}
.ma-balance small{font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}
.ma-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;z-index:1}
.ma-holder-label{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}
.ma-holder-name{font-size:11px;font-weight:700;color:#fff;line-height:1.3}
.ma-chip{width:38px;height:26px;border-radius:7px;background:linear-gradient(135deg,#f0d878,#b8941f);display:flex;align-items:center;justify-content:center;color:rgba(60,40,0,.8)}
.ma-chip svg{width:16px;height:16px;stroke-width:2}
.card-trigger{display:flex;align-items:center;gap:12px;width:100%;background:var(--glass-strong);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:12px;color:var(--text);font-weight:700;font-size:13.5px;text-align:start}
.card-trigger i{width:38px;height:38px;border-radius:12px;background:var(--field);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-trigger .ct-badge{background:var(--grad-teal);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;margin-inline-start:auto}
.card-trigger .chev{color:var(--muted)}.card-trigger .chev svg{width:15px;height:15px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 10px}
.quick button{background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;color:var(--text);font-weight:600}
.quick i{width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:var(--glass-strong);display:flex;align-items:center;justify-content:center;color:var(--primary);transition:transform .3s var(--es)}
.quick button:active i{transform:scale(.9)}
.section{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}.section h2{margin:0;font-size:15px}
.link{background:none;color:var(--primary);font-weight:700;min-height:44px;padding:8px;font-size:12.5px}
.tx{display:flex;gap:11px;align-items:center;width:100%;border-bottom:1px solid var(--line);background:none;padding:12px 0;text-align:start;color:inherit}
.tx:last-child{border-bottom:0}.tx i{width:40px;height:40px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--primary)}
.tx>span{flex:1;min-width:0}.tx strong,.tx small{display:block;overflow-wrap:anywhere}.tx strong{font-size:13.5px;font-weight:700}
.tx b{font-size:13.5px;white-space:nowrap;font-weight:800;color:var(--muted)}.tx b.in{color:var(--success)}
.btn{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:var(--glass-strong);font-weight:700;padding:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(13,110,253,.35)}
.teal{background:var(--grad-teal);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(0,168,168,.35)}
.gold{background:var(--grad-gold);color:#3a2800;border-color:transparent;box-shadow:0 10px 26px rgba(212,175,55,.35)}
.ghost{background:transparent;border-color:var(--line)}
.danger{background:linear-gradient(135deg,#f87171,#dc2656);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.tile{border:1px solid var(--border);background:var(--glass);border-radius:18px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.tile i{width:40px;height:40px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.tile strong{font-size:13.5px;font-weight:700}.tile small{font-size:11px;color:var(--muted)}
.field{display:block;margin:14px 0}.field>span{display:block;margin-bottom:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.error{color:var(--error);font-size:12.5px;min-height:1em}
.hint{padding:11px 13px;background:var(--field);border-radius:12px;font-size:11.5px;line-height:1.7;color:var(--muted);margin:14px 0}
.caption{font-size:11px;text-align:center;color:var(--muted);margin:16px 0}
.center{text-align:center}
.back{margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between}.back .title{font-weight:700;font-size:14.5px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;direction:ltr;margin:16px 0}
.key{font-size:22px;background:var(--glass-strong);border:1px solid var(--border);border-radius:16px;min-height:56px;font-weight:600}
.key:active{transform:scale(.9);background:rgba(13,110,253,.18)}
.details{margin:0}.detail{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(0,1.3fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.7}
.detail:last-child{border-bottom:0}dt{color:var(--muted);font-weight:600}
dd{margin:0;text-align:end;font-weight:700;overflow-wrap:anywhere}
.menu-list{display:flex;flex-direction:column;gap:2px}
.menu-item{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;color:var(--text);font-size:13.5px;font-weight:600;min-height:50px}
.menu-item:last-child{border-bottom:0}
.menu-item i{width:36px;height:36px;border-radius:11px;background:var(--field);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-item i svg{width:17px;height:17px}
.menu-item .mi-text{flex:1;min-width:0}
.menu-item .mi-text small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.menu-item .chev{color:var(--muted)}.menu-item .chev svg{width:15px;height:15px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline:0;z-index:10;padding:0 18px;pointer-events:none}
.nav-inner{max-width:480px;margin:auto;display:flex;justify-content:space-around;align-items:center;padding:7px;background:var(--glass-strong);border:1px solid var(--border);border-radius:999px;-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:auto}
nav button{display:flex;align-items:center;gap:7px;background:none;color:var(--text);padding:9px 13px;min-height:46px;border-radius:999px;font-weight:700;font-size:12.5px}
nav button span{display:none}nav button.active{background:var(--grad-teal);color:#fff}nav button.active span{display:inline}
dialog{width:calc(100% - 28px);max-width:480px;max-height:88vh;margin:auto;padding:18px;background:var(--glass-strong);color:var(--text);border:1px solid var(--border);border-radius:22px;overflow:auto;-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);box-shadow:0 24px 60px rgba(0,0,0,.4)}
dialog[open]{animation:modalIn .3s var(--es)}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.modal-head h2{margin:0}
#toast{position:fixed;z-index:100;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--glass-strong);color:var(--text);border:1px solid var(--border);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:999px;padding:12px 20px;max-width:calc(100% - 30px);width:max-content;font-size:12.5px;font-weight:700;box-shadow:0 10px 32px rgba(0,0,0,.35);transition:opacity .3s,transform .3s var(--es)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.global-loader{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:rgba(10,22,40,.6);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);opacity:0;transition:opacity .22s}
.global-loader.show{opacity:1}
.global-loader .ring{width:56px;height:56px;border-radius:50%;border:3px solid rgba(13,110,253,.2);border-top-color:#0d6efd;border-right-color:#00d4d4;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,rgba(13,110,253,.08) 0%,rgba(13,110,253,.16) 50%,rgba(13,110,253,.08) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:14px;margin-bottom:8px}
.sk-line.w60{width:60%}.sk-line.w40{width:40%}.sk-line.w80{width:80%}
.sk-circle{width:40px;height:40px;border-radius:50%}
.splash{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#0a2647 0%,#051020 60%,#000 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;animation:splashOut .6s ease 2.2s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.splash .sp-logo{width:100px;height:100px;border-radius:26px;background:linear-gradient(140deg,#00d4d4,#007a7a);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,168,168,.5);animation:logoIn .9s var(--es),glowPulse 2.4s ease-in-out infinite}
@keyframes logoIn{from{transform:scale(.5) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 20px 50px rgba(0,168,168,.5)}50%{box-shadow:0 20px 70px rgba(0,212,212,.85)}}
.splash .sp-logo svg{width:56px;height:56px;stroke:#fff;stroke-width:6}
.splash .sp-title{color:#fff;font-size:28px;font-weight:800;letter-spacing:-.7px;animation:fadeUp .7s ease .2s both}
.splash .sp-sub{color:rgba(255,255,255,.6);font-size:13px;animation:fadeUp .7s ease .35s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.splash .sp-loader{margin-top:24px;width:36px;height:36px;border-radius:50%;border:2.5px solid rgba(255,255,255,.12);border-top-color:#00d4d4;animation:spin 1s linear infinite}
.country-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:start;color:inherit;background:none}
.country-row:last-child{border-bottom:0}
.country-flag{font-size:24px;flex-shrink:0;width:32px;text-align:center}
.country-info{flex:1;min-width:0}.country-name{font-size:13.5px;font-weight:700;display:block}
.country-dial{font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px;display:block}
.method-tile{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--border);text-align:start;box-shadow:var(--shadow);width:100%}
.method-tile i{width:44px;height:44px;border-radius:14px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.method-tile strong{font-size:14px}.method-tile small{font-size:11.5px;color:var(--muted)}
.provider-tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--glass);border:1.5px solid var(--border);width:100%;text-align:start;margin-bottom:8px;box-shadow:var(--shadow)}
.provider-tile.selected{border-color:var(--teal);background:rgba(0,168,168,.08);box-shadow:0 6px 20px rgba(0,168,168,.25)}
.provider-logo{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px;letter-spacing:.5px}
.provider-logo.orange{background:linear-gradient(135deg,#ff7900,#ff5500)}
.provider-logo.mtn{background:linear-gradient(135deg,#ffcc00,#e6b800);color:#000}
.provider-logo.moov{background:linear-gradient(135deg,#00a0e1,#0080b8)}
.provider-info{flex:1;min-width:0}
.provider-name{font-size:14px;font-weight:700}
.provider-meta{font-size:11px;color:var(--muted);margin-top:2px}
.provider-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .25s var(--es)}
.provider-tile.selected .provider-check{background:var(--teal);border-color:var(--teal);color:#fff}
.provider-tile.selected .provider-check svg{width:14px;height:14px;stroke-width:3}
.converter-box{background:linear-gradient(135deg,rgba(0,168,168,.1),rgba(13,110,253,.06));border:1px solid rgba(0,168,168,.3);border-radius:18px;padding:16px;margin:14px 0}
.converter-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.converter-label{font-size:12px;color:var(--muted);font-weight:600}
.converter-value{font-size:15px;font-weight:800;font-family:ui-monospace,monospace}
.otp-shield{width:72px;height:72px;margin:6px auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad-teal);box-shadow:0 14px 32px rgba(0,168,168,.35)}
.otp-shield svg{width:32px;height:32px}
.otp-boxes{display:flex;justify-content:center;gap:9px;margin:22px 0 12px;direction:ltr}
.otp-box{width:44px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;position:relative;transition:all .25s var(--es)}
.otp-box.filled{border-color:var(--teal);background:rgba(0,168,168,.1)}
.otp-box.active{border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,168,168,.18)}
.otp-box.error{border-color:var(--error);background:rgba(239,68,68,.08);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.resend{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 0}.resend b{color:var(--teal)}
.otp-phone{display:inline-flex;align-items:center;gap:6px;background:var(--field);padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.process-visual{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0a2647 0%,#051020 60%,#000 100%);display:flex;align-items:center;justify-content:center;animation:pageIn .3s var(--eo)}
.pv-ring{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.pv-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}

/* ============ FX / Fees / Quote ============ */
var FX_CONFIG = { OMR_XOF: { baseRate: 1470, markupPercent: 0.8 } };
var FXEngine = { getRate: function(from,to){
  if (from==="OMR" && to==="XOF"){ var c=FX_CONFIG.OMR_XOF; return {rate:c.baseRate*(1-c.markupPercent/100),base:c.baseRate}; }
  return {rate:1,base:1};
}};
var FeeEngine = { calculate: function(){ return {totalFee:3000}; } };
var QuoteEngine = {
  create: function(p){
    var r = FXEngine.getRate(p.from,p.to);
    var f = FeeEngine.calculate();
    return { rate:r.rate, fee:f, sendAmount:p.amount, receiveAmount:Math.round(p.amount*r.rate), totalDebit:p.amount+f.totalFee, expiresAt:Date.now()+CFG.QUOTE_TTL_MS };
  }
};

/* ============ Phone Normalizer ============ */
var PhoneNorm = {
  normalize: function(num,country){
    var s=String(num).replace(/\D/g,"");
    if (country==="CI"){ if (s.length===10 && s.charAt(0)==="0") return "+225"+s; if (s.length===8) return "+225"+s; if (s.indexOf("225")===0) return "+"+s; }
    return "+"+s;
  },
  validate: function(num,country){
    var s=String(num).replace(/\D/g,"");
    if (country==="CI") return /^(\+?225)?0?\d{8,10}$/.test(s);
    return s.length>=6;
  },
  format: function(num){
    var s=String(num).replace(/\D/g,"");
    if (s.length===10) return s.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/,"$1 $2 $3 $4 $5");
    return s;
  },
  detectOperator: function(num){
    var s=String(num).replace(/\D/g,"");
    if (s.indexOf("225")===0) s=s.slice(3);
    var prefix=s.slice(0,2);
    for (var i=0;i<PROVIDERS.length;i++) if (PROVIDERS[i].prefixes && PROVIDERS[i].prefixes.indexOf(prefix)!==-1) return PROVIDERS[i];
    return null;
  }
};

/* ============ Global Loader ============ */
function showLoader(){
  var el = document.getElementById("globalLoader");
  if (!el){ el=document.createElement("div"); el.id="globalLoader"; el.className="global-loader"; el.innerHTML='<div class="ring"></div>'; document.body.appendChild(el); }
  requestAnimationFrame(function(){ el.classList.add("show"); });
}
function hideLoader(){
  var el = document.getElementById("globalLoader");
  if (!el) return;
  el.classList.remove("show");
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 250);
}

/* ============ iOS Banner (CLICKABLE) ============ */
function showBanner(title, body, opts){
  opts = opts||{};
  var el = document.getElementById("iosBanner");
  if (!el) return;
  var now = new Date();
  var tm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  var cls = opts.success ? " success" : opts.warning ? " warning" : "";
  var iconName = opts.success ? "check" : opts.warning ? "clock" : "bell";
  el.innerHTML =
    '<div class="ios-banner-icon'+cls+'">'+icon(iconName)+'</div>'+
    '<div class="ios-banner-content">'+
      '<div class="ios-banner-header"><span class="ios-banner-app">NIZWA</span><span class="ios-banner-time">'+tm+'</span></div>'+
      '<div class="ios-banner-title">'+esc(title)+'</div>'+
      '<div class="ios-banner-body">'+esc(body)+'</div>'+
    '</div>';
  bannerAction = opts.action || null;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function(){ el.classList.remove("show"); bannerAction = null; }, 5500);
}

/* ============ Toast ============ */
function toast(m){
  clearTimeout(toastTimer);
  var el = $("#toast");
  if (!el) return;
  el.textContent = m;
  el.classList.add("show");
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

/* ============ Navigation ============ */
function navigate(p, param){
  if (!logged && p !== "login") p = "login";
  if ((p === "intAmount" || p === "intReview" || p === "intOtp") && (!intDraft || !intDraft.name)) p = "transfers";
  var myNav = ++navCounter;
  showLoader();
  haptic();
  var t0 = Date.now();
  setTimeout(function(){
    if (myNav !== navCounter) return;
    page = p; pageParam = param || null;
    render();
    window.scrollTo({top:0,behavior:"instant"});
    var remain = Math.max(0, CFG.MIN_LOADING_MS - (Date.now()-t0));
    setTimeout(function(){ if (myNav === navCounter) hideLoader(); }, remain);
  }, 60);
}

/* ============ Render ============ */
function render(){
  document.documentElement.lang = state.lang || "fr";
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = state.theme || "dark";

  var unread = 0;
  for (var i=0; i<state.notifications.length; i++) if (!state.notifications[i].read) unread++;

  var h = $("#header");
  if (h) {
    var avatarHtml = state.avatarData ? '<img src="'+state.avatarData+'" alt="">' : 'A';
    h.innerHTML = logged
      ? '<div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M5 19V5l7 9 7-9v14"/></svg></span>'+t("app_name")+'</div><div class="right"><span class="omr-badge"><span class="dot"></span>OMR</span><button class="icon" data-page="notifications">'+icon("bell")+(unread>0?'<span class="badge-dot"></span>':'')+'</button><button class="icon avatar" data-page="profile">'+avatarHtml+'</button></div>'
      : '<div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M5 19V5l7 9 7-9v14"/></svg></span>'+t("app_name")+'</div>';
  }

  var navEl = $("#nav");
  if (navEl) navEl.hidden = !logged || ["home","history","cards","profile"].indexOf(page) === -1;
  var ni = $("#navInner");
  if (ni) {
    var tabs = [["home","home","home"],["history","chart","history"],["cards","card","cards"],["profile","user","profile"]];
    var out = "";
    for (var j=0;j<tabs.length;j++) out += '<button data-page="'+tabs[j][0]+'" class="'+(page===tabs[j][0]?"active":"")+'">'+icon(tabs[j][1])+'<span>'+t(tabs[j][2])+'</span></button>';
    ni.innerHTML = out;
  }

  var pages = {
    login: login, home: home, transfers: transfers, recipient: recipient,
    intLoading: intLoading, amount: amount, review: review, processing: processing, receipt: receipt,
    international: international, intMethod: intMethod, intProvider: intProvider,
    intRecipient: intRecipient, intAmount: intAmount, intReview: intReview, intOtp: intOtp,
    history: history, cards: cards, cardDetail: cardDetail, profile: profile, settings: settings,
    notifications: notifications, pending: pendingList, kyc: kyc, editProfile: editProfile,
    forgotPwd: forgotPwd
  };

  var fn = pages[page] || login;
  if (view) {
    view.innerHTML = fn();
    view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
  }

  if (page === "amount") updateAmount();
  if (page === "intAmount") { updateIntAmount(); startQuoteTimer(); }
}

    if (l >= 1) { clearInterval(procTimer); finishProcessing(); }
  }, 60);

function finishProcessing(){
  if (!intDraft) { navigate("home"); return; }
  var isInt = !intDraft.isLocal;
  var c = isInt ? findCountry(intDraft.country) : null;
  var p = isInt ? findProvider(intDraft.provider) : null;
  var ref = genRef();
  var balBefore = state.balanceBaisa;
  var b = intDraft.amountBaisa;
  var total = isInt ? b + 3000 : b;

  var tx = {
    id: ref, at: Date.now(),
    name: isInt ? intDraft.name : intDraft.recipient.name,
    destination: isInt ? intDraft.phone : ("+968 "+intDraft.recipient.number),
    kind: isInt ? p.name : "Transfert local",
    amountBaisa: total, dir: "out",
    status: state.autoSend ? "COMPLETED" : "PENDING",
    isInt: isInt,
    intCountry: isInt ? c.code : null,
    intService: isInt ? p.name : null,
    intAmountOriginalBaisa: isInt ? b : null,
    intAmountXOF: isInt && quote ? quote.receiveAmount : null,
    intRate: isInt && quote ? quote.rate : null,
    intFeesBaisa: isInt ? 3000 : 0,
    intPhone: isInt ? intDraft.phone : null,
    providerRef: isInt ? ("SBX-"+Date.now().toString(36).toUpperCase()) : null
  };

  if (state.autoSend) {
    state.transactions.unshift(tx);
    state.balanceBaisa -= total;
    state.notifications.unshift({
      id:"n"+Date.now(),
      title: isInt ? "Transfert international réussi" : "Transfert réussi",
      body: money(isInt ? b : total)+" OMR · "+tx.name,
      at: Date.now(), read: false
    });
  } else {
    state.pendingTransfers.unshift(tx);
    state.notifications.unshift({
      id:"n"+Date.now(),
      title: t("txn_pending_title"),
      body: money(isInt ? b : total)+" OMR · "+tx.name,
      at: Date.now(), read: false
    });
  }
  save();
  receiptTx = tx;
  intDraft = null; raw = ""; intRaw = ""; intOtp = ""; quote = null; draft = null;
  clearInterval(quoteTimerInt);
  navigate("receipt");
  setTimeout(function(){
    if (state.autoSend) showBanner(t("txn_sent_title"), t("txn_sent_body"), {success:true, action:function(){ navigate("receipt"); }});
    else showBanner(t("txn_pending_title"), t("txn_pending_body"), {warning:true, action:function(){ navigate("pending"); }});
  }, 900);
}

function history(){
  var list = state.transactions.slice();
  if (histFilter === "in") list = list.filter(function(x){return x.dir==="in";});
  else if (histFilter === "out") list = list.filter(function(x){return x.dir==="out";});
  else if (histFilter === "pending") list = list.filter(function(x){return x.status==="PENDING";});
  else if (histFilter === "int") list = list.filter(function(x){return x.isInt;});
  if (histSearch) {
    var q = histSearch.toLowerCase();
    list = list.filter(function(x){ return (x.name||"").toLowerCase().indexOf(q)>=0 || (x.id||"").toLowerCase().indexOf(q)>=0; });
  }
  if (histOperator !== "all") {
    list = list.filter(function(x){ return (x.kind||"").toLowerCase().indexOf(histOperator.toLowerCase())>=0; });
  }

  var totalIn = 0, totalOut = 0;
  for (var i=0; i<list.length; i++) {
    if (list[i].dir === "in") totalIn += list[i].amountBaisa;
    else totalOut += list[i].amountBaisa;
  }

  return '<h1>'+t("history")+'</h1>'+
  '<div class="search-bar">'+icon("search")+'<input id="histSearch" type="search" placeholder="'+t("search")+'" value="'+esc(histSearch)+'"></div>'+
  '<div class="filters">'+
    [["all","filter_all"],["in","filter_in"],["out","filter_out"],["pending","filter_pending"],["int","filter_int"]].map(function(f){
      return '<button type="button" class="filter '+(histFilter===f[0]?"active":"")+'" data-histfilter="'+f[0]+'">'+t(f[1])+'</button>';
    }).join("")+
  '</div>'+
  '<div class="filters">'+
    [["all","Tous opérateurs"],["Orange","Orange Money"],["MTN","MTN Money"],["Moov","Moov Money"],["local","Local"]].map(function(f){
      return '<button type="button" class="filter '+(histOperator===f[0]?"active":"")+'" data-histop="'+f[0]+'" style="font-size:11.5px;padding:7px 13px">'+f[1]+'</button>';
    }).join("")+
  '</div>'+

    var c2 = null;
    for (var i=0;i<state.cards.length;i++) if (state.cards[i].id===pageParam) c2=state.cards[i];

document.addEventListener("click", function(e){
  // Banner click
  if (e.target.closest("#iosBanner")) {
    e.preventDefault();
    if (bannerAction && typeof bannerAction === "function") {
      var act = bannerAction;
      var el = document.getElementById("iosBanner");
      if (el) el.classList.remove("show");
      bannerAction = null;
      setTimeout(act, 200);
    }
    return;
  }

  if (e.target === modal) { closeModal(); return; }
  var cl = e.target.closest("[data-close]"); if (cl) { e.preventDefault(); closeModal(); return; }

  // Country selection
  var ctry = e.target.closest("[data-country]");
  if (ctry) {
    e.preventDefault();
    var cc = ctry.dataset.country;
    var c = findCountry(cc);
    if (!c || !c.enabled) { toast(t("country_unavailable")); return; }
    intDraft = { country: cc, provider: null, name: "", phone: "", amountBaisa: 0 };
    intRaw = ""; intOtp = ""; quote = null;
    navigate("intMethod");
    return;
  }
  var im = e.target.closest("[data-intmethod]");
  if (im) { e.preventDefault(); if (im.disabled) return; navigate("intProvider"); return; }
  var ip = e.target.closest("[data-intprovider]");
  if (ip) { e.preventDefault(); intDraft.provider = ip.dataset.intprovider; navigate("intRecipient"); return; }

  // History filters
  var hf = e.target.closest("[data-histfilter]");
  if (hf) { e.preventDefault(); histFilter = hf.dataset.histfilter; render(); return; }
  var ho = e.target.closest("[data-histop]");
  if (ho) { e.preventDefault(); histOperator = ho.dataset.histop; render(); return; }

  // Page / action
  var pg = e.target.closest("[data-page]"); if (pg) { e.preventDefault(); navigate(pg.dataset.page, pg.dataset.param || null); return; }
  var a = e.target.closest("[data-action]"); if (a) { e.preventDefault(); handleAction(a.dataset.action, a.dataset.param); return; }
  var ref = e.target.closest("[data-ref]"); if (ref) { e.preventDefault(); openTx(ref.dataset.ref); return; }

  // Keypads
  var key = e.target.closest("[data-key]"); if (key) { e.preventDefault(); pressKey(key.dataset.key); return; }
  var ik = e.target.closest("[data-intkey]"); if (ik) { e.preventDefault(); intPressKey(ik.dataset.intkey); return; }
  var iok = e.target.closest("[data-intotpkey]"); if (iok) { e.preventDefault(); intPressOtp(iok.dataset.intotpkey); return; }
});

/* ============ ACTION HANDLER ============ */
function handleAction(a, param){
  switch(a){
    case "toggleBalance":
      state.hidden = !state.hidden;
      haptic();
      var el = $("#balanceDisplay");
      if (el) {
        el.classList.add("hidden-state");
        setTimeout(function(){ render(); }, 120);
      } else render();
      break;

    case "startLocal":
      draft = { kind:"local", name:"", number:"" }; raw = "";
      navigate("recipient");
      break;

    case "review": navigate("review"); break;

    case "confirmLocal": confirmLocal(); break;

    case "intContinue":
      var b = parseAmount(intRaw);
      if (!b || b <= 0) { toast(t("invalid_amount")); return; }
      var total = b + 3000;
      if (total > state.balanceBaisa) { toast(t("insufficient_balance")); return; }
      intDraft.amountBaisa = b;
      navigate("intReview");
      break;

    case "intConfirm":
      intOtp = ""; intOtpErr = false;
      if (resendTimer) { clearInterval(resendTimer); resendTimer = null; }
      startResendTimer();
      navigate("intOtp");
      break;

    case "resendOtp": toast("Code renvoyé (démo)."); startResendTimer(); break;

    case "forgotPwd": navigate("forgotPwd"); break;

    case "sendReset":
      var em = $("#resetEmail");
      if (!em || !em.value) { toast(t("required")); return; }
      showLoader();
      setTimeout(function(){
        hideLoader();
        toast(t("reset_email_sent"));
        navigate("login");
      }, 900);
      break;

    case "biometricLogin":
      showLoader();
      setTimeout(function(){
        hideLoader();
        logged = true;
        saveSession();
        navigate("home");
      }, 900);
      break;

    case "langPicker": openModal("langPicker"); break;
    case "setLang": state.lang = param; save(); closeModal(); render(); break;
    case "themePicker": openModal("themePicker"); break;
    case "setTheme": state.theme = param; save(); closeModal(); render(); break;

    case "toggleAutoSend":
      state.autoSend = !state.autoSend;
      save();
      toast(state.autoSend ? "Envoi automatique activé" : "Envoi en attente activé");
      render();
      break;

    case "validatePending":
      var p = null;
      for (var i=0;i<state.pendingTransfers.length;i++) if (state.pendingTransfers[i].id===param) { p=state.pendingTransfers[i]; break; }
      if (p) {
        state.pendingTransfers = state.pendingTransfers.filter(function(x){return x.id!==param;});
        p.status = "COMPLETED";
        state.balanceBaisa -= p.amountBaisa;
        state.transactions.unshift(p);
        save();
        toast("Transfert validé");
        showBanner(t("txn_sent_title"), t("txn_sent_body"), {success:true, action:function(){ navigate("receipt"); }});
        receiptTx = p;
        render();
      }
      break;

    case "cancelPending":
      state.pendingTransfers = state.pendingTransfers.filter(function(x){return x.id!==param;});
      save();
      toast("Transfert annulé");
      render();
      break;

    case "addCard":
      if (state.cards.length >= 5) { toast("Maximum 5 cartes"); return; }
      var last4 = String(Math.floor(1000+Math.random()*9000));
      state.cards.push({ id:"c"+Date.now(), last4:last4, exp:"05/28", type:"VISA", frozen:false, isDefault:false });
      save(); toast(t("add_card")); render();
      break;

    case "removeCard":
      if (!confirm(t("remove_card_confirm"))) return;
      state.cards = state.cards.filter(function(c){return c.id!==param;});
      if (!state.cards.length) state.cards = JSON.parse(JSON.stringify(DEFAULT_STATE.cards));
      else if (!state.cards.some(function(c){return c.isDefault;})) state.cards[0].isDefault = true;
      save(); render();
      break;

    case "setDefaultCard":
      state.cards.forEach(function(c){ c.isDefault = (c.id===param); });
      save(); render();
      break;

    case "cardFullDetails":
      pageParam = param;
      openModal("cardFullDetails");
      break;

    case "copyCard":
      copyText("4000 1234 5678 " + (state.cards[0] ? state.cards[0].last4 : ""));
      break;

    case "startKyc":
      showLoader();
      setTimeout(function(){
        state.kycVerified = true;
        save();
        hideLoader();
        render();
        showBanner("KYC", "Identité vérifiée", {success:true});
      }, 1200);
      break;

    case "pickAvatar": avatarInput && avatarInput.click(); break;

    case "saveProfile":
      save();
      toast(t("validate"));
      navigate("profile");
      break;

    case "shareReceipt":
      if (receiptTx && navigator.share) {
        navigator.share({title:"Nizwa", text:t("transaction_ref")+": "+receiptTx.id}).catch(function(){});
      } else if (receiptTx) {
        copyText(receiptTx.id);
      }
      break;

    case "downloadReceipt":
      if (receiptTx) {
        var txt = "Nizwa — "+receiptTx.id+"\n"+when(receiptTx.at)+"\n"+money(receiptTx.amountBaisa)+" OMR\n"+receiptTx.name;
        var blob = new Blob([txt],{type:"text/plain;charset=utf-8"});
        var url = URL.createObjectURL(blob);
        var aa = document.createElement("a");
        aa.href = url; aa.download = "receipt-"+receiptTx.id+".txt";
        document.body.appendChild(aa); aa.click(); aa.remove();
        setTimeout(function(){URL.revokeObjectURL(url);},2000);
      }
      break;

    case "printReceipt":
      if (receiptTx) {
        $("#printArea").innerHTML = '<div style="padding:24px;font-family:system-ui"><h1>Nizwa</h1><h2>'+t("receipt")+' '+esc(receiptTx.id)+'</h2>'+rows([
          [t("amount"),money(receiptTx.amountBaisa)+" OMR"],
          [t("recipient"),receiptTx.name],
          [t("date"),when(receiptTx.at)]
        ])+'</div>';
        setTimeout(function(){ window.print(); }, 80);
      }
      break;

    case "copyRef":
      if (receiptTx) copyText(receiptTx.id);
      break;

    case "logout":
      logged = false;
      clearSession();
      draft = null; intDraft = null; receiptTx = null;
      navigate("login");
      break;

    case "request": toast("Fonction bientôt disponible."); break;
    case "topup": toast("Fonction bientôt disponible."); break;
  }
}

/* ============ COPY HELPER ============ */
function copyText(s){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s);
      toast(t("copied"));
      return;
    }
    throw 0;
  } catch(e) {
    var ta = document.createElement("textarea");
    ta.value = s;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast(t("copied")); } catch(x){ toast(t("copyManual")||"Copié"); }
    ta.remove();
  }
}
