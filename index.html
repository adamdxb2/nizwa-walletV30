<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nizwa Wallet">
<title>Nizwa Wallet</title>
<style>
:root{color-scheme:light;--bg:#faf8ff;--bg-grad:linear-gradient(165deg,#fdfbff 0%,#f5f0ff 45%,#ede3ff 100%);--field:rgba(124,58,237,.055);--text:#1a0e2e;--muted:#7a6b94;--line:rgba(124,58,237,.12);--violet:#7c3aed;--violet-dark:#5b21b6;--violet-light:#a78bfa;--yellow:#f59e0b;--error:#dc2656;--success:#10b981;--glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.85);--border:rgba(124,58,237,.1);--shadow:0 6px 24px rgba(90,40,180,.08);--grad:linear-gradient(135deg,#a78bfa 0%,#7c3aed 100%);--eo:cubic-bezier(.16,1,.3,1);--es:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-backface-visibility:hidden;backface-visibility:hidden}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:scroll;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button{cursor:pointer;transition:transform .22s var(--es),opacity .15s,box-shadow .22s;will-change:transform;border:0}
button:disabled{opacity:.4;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.94)}
input,select,textarea{transition:border-color .22s,box-shadow .22s,background .22s}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0 0 12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
h3{font-size:14px;font-weight:700}
p{line-height:1.6}
small,.muted{color:var(--muted)}
small{font-size:12px;line-height:1.6}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.app{max-width:520px;margin:auto;min-height:100vh;position:relative;overflow:hidden}
main{animation:pageIn .42s var(--eo)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border)}
header .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px}
header .brand .logo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
header .brand .logo svg{width:19px;height:19px;stroke:#fff;stroke-width:2.4}
header .right{display:flex;gap:9px;align-items:center}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--glass-strong);display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;flex-shrink:0;box-shadow:0 2px 8px rgba(90,40,180,.05)}
.icon:active{transform:scale(.88)}
.icon .badge-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--error);border:2px solid var(--bg);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.avatar{background:var(--grad);color:#fff;font-weight:800;border:0}
.omr-badge{display:inline-flex;align-items:center;gap:6px;background:var(--glass-strong);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800}
.omr-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15);animation:pulseDot 2s ease-in-out infinite}
main{padding:14px 18px calc(120px + env(safe-area-inset-bottom,0px))}
.card{position:relative;border:1px solid var(--border);border-radius:24px;padding:18px;background:var(--glass);box-shadow:var(--shadow);margin-bottom:12px;overflow-wrap:anywhere;transform:translateZ(0)}
.hello h1{margin-bottom:2px}
.hello p{margin-bottom:16px}
.main-account{border-radius:26px;padding:22px;margin:8px 0 16px;background:linear-gradient(145deg,#a78bfa 0%,#7c3aed 45%,#5b21b6 100%);color:#fff;overflow:hidden;box-shadow:0 18px 44px rgba(124,58,237,.32);animation:cardAppear .7s var(--eo) both;position:relative}
@keyframes cardAppear{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
.ma-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ma-label-wrap{display:flex;flex-direction:column;gap:3px}
.ma-label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.75)}
.ma-num{font-size:12.5px;font-weight:700;font-family:ui-monospace,monospace;letter-spacing:1px}
.ma-eye{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;display:flex;align-items:center;justify-content:center}
.ma-eye svg{width:18px;height:18px}
.ma-balance-wrap{margin-bottom:24px}
.ma-balance-label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700;margin-bottom:6px}
.ma-balance{font-size:40px;font-weight:800;letter-spacing:-1.4px;line-height:1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ma-balance small{font-size:15px;font-weight:700;color:rgba(255,255,255,.85)}
.ma-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ma-holder{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ma-holder-label{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.65);font-weight:700}
.ma-holder-name{font-size:12px;font-weight:700;color:#fff;overflow-wrap:anywhere;line-height:1.3}
.ma-chip{width:42px;height:30px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,#fff0be,#dcb45a);display:flex;align-items:center;justify-content:center;color:rgba(120,80,20,.7)}
.ma-chip svg{width:18px;height:18px;stroke-width:2}
.card-trigger{display:flex;align-items:center;gap:12px;width:100%;background:var(--glass-strong);border:1px solid var(--border);border-radius:18px;padding:13px 14px;margin-bottom:12px;color:var(--text);font-weight:700;font-size:13.5px;text-align:start;box-shadow:0 2px 12px rgba(90,40,180,.05)}
.card-trigger i{width:38px;height:38px;border-radius:12px;background:rgba(124,58,237,.1);color:var(--violet);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-trigger .ct-badge{background:var(--grad);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;margin-inline-start:auto}
.card-trigger .chev{color:var(--muted)}
.card-trigger .chev svg{width:15px;height:15px}
.card-preview{border-radius:18px;padding:14px 16px;margin-bottom:14px;cursor:pointer;background:linear-gradient(145deg,#a78bfa 0%,#7c3aed 55%,#5b21b6 100%);color:#fff;box-shadow:0 10px 28px rgba(124,58,237,.28);overflow:hidden;position:relative}
.card-preview::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.15) 45%,transparent 60%);background-size:250% 100%;background-position:-100% 0;animation:cardSheen 6s ease-in-out infinite}
@keyframes cardSheen{0%,60%{background-position:-100% 0}70%,100%{background-position:200% 0}}
.card-preview.frozen{filter:grayscale(.85) saturate(.55)}
.cp-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;position:relative;z-index:1}
.cp-num{font-family:ui-monospace,monospace;letter-spacing:1.6px;font-size:12px}
.cp-bot{display:flex;justify-content:space-between;font-size:10.5px;opacity:.85;margin-top:8px;position:relative;z-index:1}
.dir-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.dir-row:last-child{border-bottom:0}
.dir-avatar{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:rgba(124,58,237,.12);border:1px solid var(--border);color:var(--violet)}
.dir-info{flex:1;min-width:0}
.dir-name{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.dir-num{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:2px;direction:ltr}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 10px}
.quick button{background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;color:var(--text);padding:0;font-weight:600}
.quick i{width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:var(--glass-strong);display:flex;align-items:center;justify-content:center;color:var(--violet);box-shadow:0 2px 12px rgba(90,40,180,.06);transition:transform .3s var(--es)}
.quick button:active i{transform:scale(.88)}
.section{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.section h2{margin:0;font-size:15px}
.link{background:none;color:var(--violet);font-weight:700;min-height:44px;padding:8px;font-size:12.5px}
.tx{display:flex;gap:11px;align-items:center;width:100%;border-bottom:1px solid var(--line);background:none;padding:12px 0;text-align:start;color:inherit}
.tx:last-child{border-bottom:0}
.tx i{width:40px;height:40px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--violet)}
.tx>span{flex:1;min-width:0}
.tx strong,.tx small{display:block;overflow-wrap:anywhere}
.tx strong{font-size:13.5px;font-weight:700}
.tx b{font-size:13.5px;white-space:nowrap;font-weight:800;color:var(--muted)}
.tx b.in{color:var(--success)}
.btn{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--border);background:var(--glass-strong);font-weight:700;padding:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 12px rgba(90,40,180,.05)}
.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(124,58,237,.35)}
.yellow{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1f1600;border-color:transparent}
.ghost{background:transparent;border-color:var(--line)}
.danger{background:linear-gradient(135deg,#f87171,#dc2656);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.tile{border:1px solid var(--border);background:var(--glass);border-radius:20px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.tile i{width:40px;height:40px;border-radius:12px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--violet)}
.tile strong{font-size:13.5px;font-weight:700}
.tile small{font-size:11px;color:var(--muted)}
.field{display:block;margin:14px 0}
.field>span{display:block;margin-bottom:7px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;min-width:0;background:rgba(124,58,237,.05);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:16px}
input:focus,select:focus,textarea:focus{background:rgba(255,255,255,.9);border-color:var(--violet);outline:none;box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.input-row{display:flex;gap:8px;align-items:center}
.input-row input{flex:1}
.error{color:var(--error);font-size:12.5px;min-height:1em}
.hint{padding:11px 13px;background:var(--field);border-radius:14px;font-size:11.5px;line-height:1.7;color:var(--muted);margin:14px 0}
.caption{font-size:11px;text-align:center;color:var(--muted);margin:16px 0}
.center{text-align:center}
.back{margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.back .title{font-weight:700;font-size:14.5px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;direction:ltr;margin:16px 0}
.key{font-size:22px;background:var(--glass-strong);border:1px solid var(--border);border-radius:18px;min-height:56px;font-weight:600;transition:transform .15s var(--es),background .15s}
.key:active{transform:scale(.9);background:rgba(124,58,237,.14)}
.amount{font-size:44px;font-weight:800;letter-spacing:-1.4px;margin:10px 0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.details{margin:0}
.detail{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(0,1.3fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.7}
.detail:last-child{border-bottom:0}
dt{color:var(--muted);font-weight:600}
dd{margin:0;text-align:end;font-weight:700;overflow-wrap:anywhere;unicode-bidi:plaintext}
.filters{display:flex;gap:7px;overflow:auto;margin:12px 0;padding-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;font-size:12.5px;border:1px solid var(--border);background:var(--glass-strong);border-radius:999px;padding:9px 16px;font-weight:600}
.filter.active{background:var(--grad);color:#fff;border-color:transparent}
.menu-list{display:flex;flex-direction:column;gap:2px}
.menu-item{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;color:var(--text);font-size:13.5px;font-weight:600;min-height:50px}
.menu-item:last-child{border-bottom:0}
.menu-item i{width:36px;height:36px;border-radius:11px;background:var(--field);color:var(--violet);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-item i svg{width:17px;height:17px}
.menu-item .mi-text{flex:1;min-width:0}
.menu-item .mi-text small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.menu-item .chev{color:var(--muted);flex-shrink:0}
.menu-item .chev svg{width:15px;height:15px}
.otp-shield{width:72px;height:72px;margin:6px auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad);box-shadow:0 14px 32px rgba(124,58,237,.35);animation:shieldIn .6s var(--es)}
@keyframes shieldIn{from{transform:scale(.4) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.otp-shield svg{width:32px;height:32px}
.otp-boxes{display:flex;justify-content:center;gap:9px;margin:22px 0 12px;direction:ltr}
.otp-box{width:44px;height:56px;border-radius:13px;border:1.5px solid var(--line);background:var(--field);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;position:relative;transition:transform .25s var(--es),border-color .25s,background .25s}
.otp-box.filled{border-color:var(--violet);background:rgba(124,58,237,.09);animation:otpPop .3s var(--es)}
@keyframes otpPop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.otp-box.active{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,58,237,.16)}
.otp-box.error{border-color:var(--error);background:rgba(220,38,86,.08);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.resend{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.resend b{color:var(--violet)}
.otp-phone{display:inline-flex;align-items:center;gap:6px;background:var(--field);padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.process{padding:36px 0 8px;text-align:center}
.process-title{font-size:20px;font-weight:800;margin-bottom:24px;animation:titleIn .6s var(--eo)}
@keyframes titleIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reactor-wrap{position:relative;width:150px;height:150px;margin:14px auto 30px}
.reactor{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(167,139,250,0) 0deg,rgba(167,139,250,.95) 90deg,rgba(245,158,11,.85) 200deg,rgba(167,139,250,0) 320deg);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);animation:spin 2s linear infinite;filter:drop-shadow(0 0 20px rgba(124,58,237,.4))}
@keyframes spin{to{transform:rotate(360deg)}}
.reactor-core{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(167,139,250,.6),rgba(124,58,237,.15) 60%,transparent 75%);animation:corePulse 2s ease-in-out infinite}
@keyframes corePulse{0%,100%{transform:scale(.9);opacity:.55;filter:blur(2px)}50%{transform:scale(1.1);opacity:1;filter:blur(5px)}}
.process-cancel{max-width:260px;margin:0 auto}
.check{width:80px;height:80px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(140deg,#34d399,#10b981);color:#fff;margin:10px auto 16px;box-shadow:0 14px 36px rgba(16,185,129,.35);animation:checkPop .7s var(--es)}
@keyframes checkPop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.1) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.check svg{width:42px;height:42px;stroke-width:3}
.receipt{border-top:4px solid var(--violet);padding-top:22px}
.bank-logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px dashed var(--line)}
.bank-logo .emblem{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--grad);box-shadow:0 8px 22px rgba(124,58,237,.3)}
.bank-logo .emblem svg{width:32px;height:32px;stroke:#fff;stroke-width:2.6}
.bank-logo .name{font-weight:800;font-size:14.5px}
.bank-logo .sub{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:600}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border:0}
.setting span{font-weight:600;font-size:13.5px}
.switch{width:50px;height:29px;border-radius:999px;background:rgba(124,58,237,.15);position:relative;flex-shrink:0;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .28s var(--es);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.switch[aria-checked="true"]{background:var(--grad)}
.switch[aria-checked="true"]::after{transform:translateX(21px)}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));inset-inline:0;z-index:10;padding:0 18px;pointer-events:none}
.nav-inner{max-width:480px;margin:auto;display:flex;justify-content:space-around;align-items:center;padding:7px;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:999px;-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:0 8px 30px rgba(90,40,180,.12);pointer-events:auto}
nav button{display:flex;align-items:center;gap:7px;background:none;color:var(--text);padding:9px 13px;min-height:46px;border-radius:999px;font-weight:700;font-size:12.5px}
nav button span{display:none}
nav button.active{background:var(--grad);color:#fff}
nav button.active span{display:inline}
dialog{width:calc(100% - 28px);max-width:480px;max-height:88vh;margin:auto;padding:18px;background:rgba(255,255,255,.96);color:var(--text);border:1px solid var(--border);border-radius:26px;overflow:auto;-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:0 24px 60px rgba(90,40,180,.2)}
dialog[open]{animation:modalIn .35s var(--es)}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(90,40,180,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.modal-head h2{margin:0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.8 system-ui}

function monthlySpent(){var k=monthKey(Date.now());var tot=0;for (var i=0;i<state.transactions.length;i++){var x=state.transactions[i];if (x.dir==="out"&&monthKey(x.at)===k) tot+=x.amountBaisa;}return tot;}
function updateAi(){var el=$("#aiText");if (!el) return;var s=monthlySpent();if (state.savingMode) el.innerHTML=t("aiSavingOn");else if (s>30000) el.innerHTML=t("aiInsight").replace("{x}",money(s));else el.innerHTML=t("aiGreeting");}
function toggleSavingMode(){state.savingMode=!state.savingMode;save();toast(state.savingMode?t("aiSavingOn"):t("close2"));render();}
function toggleBalance(){state.hidden=!state.hidden;haptic();render();}

function chartHTML(){var ms=[];var now=new Date();for (var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");var lb=["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"][d.getMonth()];var sp=0;for (var j=0;j<state.transactions.length;j++){var x=state.transactions[j];if (x.dir==="out"&&monthKey(x.at)===k) sp+=x.amountBaisa;}ms.push({label:lb,spent:sp});}var mx=1;for (var m=0;m<ms.length;m++){if (ms[m].spent>mx) mx=ms[m].spent;}var out='<div class="chart-bars">';for (var n=0;n<ms.length;n++){var mm=ms[n];var h=Math.max(4,(mm.spent/mx)*80);out+='<div class="chart-bar"><div class="bar" style="height:'+h+'px"></div><small>'+esc(mm.label)+'</small></div>';}out+='</div>';return out;}

function intPressKey(k){if (k==="⌫") intRaw=intRaw.slice(0,-1);else if (k==="."){if (intRaw.indexOf(".")>=0) return;intRaw=(intRaw||"0")+".";}else{var p=intRaw.split(".");if (p[1]&&p[1].length>=3) return;if (intRaw==="0") intRaw=k;else intRaw+=k;if (intRaw.replace(".","").length>10) intRaw=intRaw.slice(0,-1);}haptic();updateIntAmount();}

function intOtp(){var bx="";for (var i=0;i<6;i++){var f=intOtp[i]||"";var a=i===intOtp.length&&!intOtpErr;var cls="otp-box"+(f?" filled":"")+(a?" active":"")+(intOtpErr?" error":"");bx+='<div class="'+cls+'">'+f+'</div>';}return '<div class="back"><button class="icon" data-action="intCancelOtp">'+icon("back")+'</button></div><div class="card" style="text-align:center"><div class="otp-shield">'+icon("shield")+'</div><h1 style="margin-bottom:8px">'+esc(t("otpTitle"))+'</h1><p class="muted" style="margin-bottom:16px">'+esc(t("otpDesc"))+'</p><div class="otp-phone">'+icon("smartphone")+' '+OTP_PHONE+'</div><div class="otp-boxes">'+bx+'</div>'+(intOtpErr?'<p class="error center">'+esc(t("otpInvalid"))+'</p>':'<p class="error center"></p>')+'<p class="resend" id="resendLine">'+(resendCountdown>0?esc(t("otpResend"))+' <b>00:'+String(resendCountdown).padStart(2,"0")+'</b>':'<button class="link" data-action="intResendOtp" style="min-height:auto">'+esc(t("otpResendNow"))+'</button>')+'</p></div><div class="keypad">'+["1","2","3","4","5","6","7","8","9","","0","⌫"].map(function(k){if (k==="") return '<button type="button" class="key" disabled style="opacity:0"></button>';return '<button type="button" class="key" data-intotpkey="'+k+'">'+k+'</button>';}).join("")+'</div><button class="btn primary" data-action="intSubmitOtp" '+(intOtp.length!==6?"disabled":"")+'>'+esc(t("otpConfirm"))+'</button>';}

function intPressOtp(k){if (intOtpErr){intOtp="";intOtpErr=false;}if (k==="⌫") intOtp=intOtp.slice(0,-1);else if (/^\d$/.test(k)){if (intOtp.length<6) intOtp+=k;}haptic();if (intOtp.length===6){var c=intOtp;render();setTimeout(function(){if (intOtp!==c) return;if (c===OTP_CODE) startIntProcessing();else{intOtpErr=true;render();setTimeout(function(){intOtp="";intOtpErr=false;render();},TIMING.otpErrorReset);}},TIMING.otpAutoSubmit);}else render();}

function updateIntProgress(){if (!intDraft) return;var e=Date.now()-intStarted;var l=Math.min(1,e/TIMING.intProcessing);var b=$("#cancelIntBtn");if (b){if (l>0.55){b.style.opacity="0";b.style.pointerEvents="none";}else{b.style.opacity="1";b.style.pointerEvents="auto";}}}

function startIntProcessing(){var b=parseAmount(intRaw);if (!b||b<=0){toast(t("invalidAmount"));navigate("intAmount");return;}var total=b+INT_FEES_BAISA;if (total>state.balanceBaisa){toast(t("insufficient"));navigate("intAmount");return;}intDraft.amountBaisa=b;intStarted=Date.now();clearInterval(intTimer);intTimer=setInterval(function(){updateIntProgress();if (Date.now()-intStarted>=TIMING.intProcessing){clearInterval(intTimer);intTimer=null;finishIntProcessing();}},150);navigate("intProcessing");}
function cancelIntProcess(){if (intTimer){clearInterval(intTimer);intTimer=null;}intDraft=null;intRaw="";intOtp="";if (resendTimer){clearInterval(resendTimer);resendTimer=null;}toast(t("cancelled"));navigate("home");}

function finishIntProcessing(){if (!intDraft) return;var b=intDraft.amountBaisa;var total=b+INT_FEES_BAISA;var ref="IN"+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100);var amountOMR=b/1000;var xof=Math.round(amountOMR*OMR_TO_XOF);var serviceLabel=intDraft.method==="moneygram"?t("intMoneyGram"):(intDraft.wallet||t("intEwallet"));var tx={id:ref,at:Date.now(),name:intDraft.name,destination:intDraft.phone,kind:serviceLabel,note:"",amountBaisa:total,dir:"out",status:"pending",isInt:true,intCountry:intDraft.country.c,intService:serviceLabel,intAmountOriginalBaisa:b,intAmountXOF:xof,intFeesBaisa:INT_FEES_BAISA,intRate:OMR_TO_XOF,intPhone:intDraft.phone};state.transactions.unshift(tx);state.balanceBaisa-=total;state.notifications.unshift({id:"n"+Date.now(),title:t("intProcessingTitle"),body:money(b)+" OMR · "+tx.name,at:Date.now(),read:false,kind:"out"});save();receiptTx=tx;var txCopy=JSON.parse(JSON.stringify(tx));setTimeout(function(){showIosStyleNotif(txCopy,"pending");},TIMING.intNotif1Delay);setTimeout(function(){markTxCompleted(txCopy.id);showIosStyleNotif(txCopy,"success");},TIMING.intNotif2Delay);intDraft=null;intRaw="";intOtp="";if (resendTimer){clearInterval(resendTimer);resendTimer=null;}navigate("intReceipt");}

function doLogin(){var a=$("#loginAccount").value.trim();var p=$("#loginPassword").value;if (a===ACCOUNT&&p===PASSWORD){logged=true;navigate("home");}else error(t("invalidLogin"));}

function submitRecipient(){if (!draft) return;if (draft.kind==="local"){var n=normalizedPhone($("#number").value);if (!/^\d{7,8}$/.test(n)){error(t("invalidNumber"));return;}var m=lookupDirectory(n);if (m){draft.number=m.number;draft.name=m.name;}else{draft.number=n;draft.name="+968 "+n;}}else if (draft.kind==="international"){var nm=$("#name").value.trim();if (!nm){error(t("required"));return;}draft.name=nm;draft.country=$("#country").value;}else if (draft.kind==="bank"){var b=$("#bank").value.trim(),r=$("#reference").value.trim();if (!b||!r){error(t("required"));return;}draft.bank=b;draft.number=r;draft.name=b;}navigate("amount");}
function goToOtp(){var b=parseAmount(raw);if (!b||b<=0){error(t("invalidAmount"));return;}if (b>state.balanceBaisa){error(t("insufficient"));return;}otpInput="";otpError=false;if (resendTimer){clearInterval(resendTimer);resendTimer=null;}navigate("otp");}
function addCard(){if (state.cards.length>=3){toast(t("cardLimitMax"));return;}var l4=String(Math.floor(1000+Math.random()*9000));var n=new Date();var m=String(n.getMonth()+1).padStart(2,"0");var y=String((n.getFullYear()+3)%100);state.cards.push({id:"c"+Date.now(),last4:l4,exp:m+"/"+y,type:"VISA",frozen:false,online:true,contactless:true,atm:true,dailyLimit:1000000});save();toast(t("cardAdded"));render();}
function removeCard(id){if (!confirm(t("removeCardConfirm"))) return;state.cards=state.cards.filter(function(c){return c.id!==id;});if (!state.cards.length) state.cards=JSON.parse(JSON.stringify(DEFAULT_STATE.cards));save();toast(t("cardRemoved"));if (page==="cardDetail"||page==="cardSettings") navigate("cards");else render();}
function togglePassword(){var i=$("#loginPassword"),b=$("#pwToggle");if (!i||!b) return;var s=i.type==="password";i.type=s?"text":"password";b.innerHTML=icon(s?"eyeOff":"eye");}
function toggleSetting(k,cardId){if (k==="frozen") state.frozen=!state.frozen;else if (k==="biometrics") state.biometrics=!state.biometrics;else if (k==="twoFactor") state.twoFactor=!state.twoFactor;else if (k.indexOf("card_")===0){var c=null;for (var i=0;i<state.cards.length;i++){if (state.cards[i].id===cardId) c=state.cards[i];}if (!c) return;var f=k.slice(5);if (f==="freeze") c.frozen=!c.frozen;else c[f]=!c[f];}save();haptic();render();}

function addContact(){var num=($("#cNumber")?$("#cNumber").value:"").replace(/\D/g,"");var nm=($("#cName")?$("#cName").value:"").trim();if (!num||!nm){error(t("required"));return;}if (num.length<7||num.length>12){error(t("invalidNumber"));return;}if (state.directory[num]){error(t("contactExists"));return;}state.directory[num]=nm;save();toast(t("contactSaved"));navigate("directory");}

function handleAction(a,param){
switch(a){
case "addCard":addCard();break;
case "toggleBalance":toggleBalance();break;
case "note":openModal("note");break;
case "request":openModal("request");break;
case "topup":openModal("topup");break;
case "transfers":navigate("transfers");break;
case "start":startTransfer(param||"local");break;
case "startInt":startInt();break;
case "bankSoon":toast(t("intBankUnavailable"));break;
case "review":goToOtp();break;
case "confirm":goToOtp();break;
case "submitOtp":pressOtp("");break;
case "cancelOtp":if (resendTimer){clearInterval(resendTimer);resendTimer=null;}otpInput="";otpError=false;navigate("review");break;
case "resendOtp":toast(t("otpSent"));startResendTimer();break;
