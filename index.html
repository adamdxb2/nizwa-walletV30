<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a2647">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nizwa">
<title>Nizwa</title>
<style>
:root{--bg:#0a1628;--bg2:radial-gradient(ellipse at 20% -10%,#123a5c 0%,#0a2647 45%,#051020 100%);--fg:#f0f4f8;--mut:#8ba3bf;--ln:rgba(255,255,255,.08);--pri:#0d6efd;--teal:#00a8a8;--teal-l:#00d4d4;--ok:#10b981;--err:#ef4444;--warn:#f59e0b;--gold:#d4af37;--gd:rgba(255,255,255,.05);--gs:rgba(255,255,255,.09);--bd:rgba(255,255,255,.1);--sh:0 6px 24px rgba(0,0,0,.5);--gr:linear-gradient(135deg,#00d4d4 0%,#007a7a 100%);--gr2:linear-gradient(135deg,#0d6efd 0%,#0a2647 100%);--gr3:linear-gradient(135deg,#8b6dd8 0%,#5b34a8 100%);--grg:linear-gradient(135deg,#e6c869 0%,#b8941f 100%);--e1:cubic-bezier(.16,1,.3,1);--e2:cubic-bezier(.34,1.56,.64,1)}
html[data-theme="light"]{--bg:#f0f4f8;--bg2:radial-gradient(ellipse at 20% -10%,#e6f0ff 0%,#d4e4f5 45%,#c5d8eb 100%);--fg:#0a1628;--mut:#5a7186;--ln:rgba(13,110,253,.12);--gd:rgba(255,255,255,.75);--gs:rgba(255,255,255,.92);--bd:rgba(255,255,255,.9);--sh:0 6px 24px rgba(10,38,71,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);background-image:var(--bg2);background-attachment:fixed;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .2s var(--e2),opacity .15s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4}
input{width:100%;background:var(--gd);border:1px solid var(--bd);border-radius:12px;padding:14px;font-size:16px}
input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(13,110,253,.15)}
[hidden]{display:none!important}
h1{margin:0 0 12px;font-size:26px;font-weight:800;letter-spacing:-.5px}
h2{margin:0 0 12px;font-size:17px;font-weight:700}
h3{margin:0 0 8px;font-size:14px;font-weight:700}
p{margin:0 0 12px;line-height:1.6}
small{color:var(--mut);font-size:12px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.mut{color:var(--mut)}
.ctr{text-align:center}
.app{max-width:520px;margin:auto;min-height:100vh;position:relative}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;background:var(--gd);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--bd)}
header .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
header .lg{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--gr);color:#fff;box-shadow:0 4px 12px rgba(0,168,168,.35)}
header .lg svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4}
header .right{display:flex;gap:9px;align-items:center}
.ico{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--gs);display:flex;align-items:center;justify-content:center;color:var(--fg);position:relative;flex-shrink:0}
.ico:active{transform:scale(.88)}
.ico .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--err);border:2px solid var(--bg);animation:pd 2s ease-in-out infinite}
@keyframes pd{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.av{background:var(--gr);color:#fff;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--gs);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800}
main{padding:14px 18px calc(130px + env(safe-area-inset-bottom,0px));animation:pi .35s var(--e1)}
@keyframes pi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{border:1px solid var(--bd);border-radius:20px;padding:18px;background:var(--gd);box-shadow:var(--sh);margin-bottom:12px;overflow-wrap:anywhere}
/* Main account card */
.acc{border-radius:22px;padding:20px;margin:6px 0 14px;background:linear-gradient(145deg,#0a2647 0%,#134d7a 50%,#0d6efd 100%);color:#fff;overflow:hidden;box-shadow:0 18px 44px rgba(13,110,253,.4);position:relative;transform-style:preserve-3d;transition:transform .4s var(--e1)}
.acc::after{content:"";position:absolute;top:-50%;right:-30%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,212,.35),transparent 70%);pointer-events:none;animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{transform:translate(0,0)}50%{transform:translate(-15px,15px)}}
.acc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);background-size:250% 100%;background-position:-100% 0;animation:sheen 7s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,55%{background-position:-100% 0}70%,100%{background-position:200% 0}}
.acc>*{position:relative;z-index:1}
.acc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.acc .lbl{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;opacity:.75}
.acc .num{font-size:12px;font-weight:700;font-family:ui-monospace,monospace;letter-spacing:1px}
.acc .eye{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center}
.acc .eye svg{width:16px;height:16px}
.acc .bal-lbl{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;opacity:.7;margin-bottom:4px}
.acc .bal{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;margin-bottom:14px;transition:opacity .35s,transform .35s var(--e2)}
.acc .bal.hid{opacity:.5;transform:scale(.98)}
.acc .bal small{font-size:13px;opacity:.85}
.acc .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.acc .hlbl{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;opacity:.6}
.acc .hname{font-size:11px;font-weight:700;line-height:1.3}
.acc .chip{width:38px;height:26px;border-radius:7px;background:linear-gradient(135deg,#f0d878,#b8941f);display:flex;align-items:center;justify-content:center;color:rgba(60,40,0,.8)}
.acc .chip svg{width:16px;height:16px;stroke-width:2}
/* Mini stats inside account card */
.acc .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:relative;z-index:1}
.acc .st{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;backdrop-filter:blur(10px)}
.acc .st .sl{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;opacity:.7}
.acc .st .sv{font-size:14px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
/* Recent recipients */
.recips{display:flex;gap:10px;overflow:auto;margin:0 -18px 14px;padding:4px 18px 8px;scroll-snap-type:x mandatory}
.recips::-webkit-scrollbar{display:none}
.rec{flex-shrink:0;width:70px;text-align:center;scroll-snap-align:start}
.rec .rav{width:54px;height:54px;border-radius:50%;background:var(--gd);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--pri);margin:0 auto 6px;overflow:hidden;position:relative}
.rec .rav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rec .rn{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trg{display:flex;align-items:center;gap:12px;width:100%;background:var(--gs);border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:12px;color:var(--fg);font-weight:700;font-size:13.5px;text-align:left}
.trg i{width:38px;height:38px;border-radius:12px;background:var(--gd);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trg .b{background:var(--gr);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;margin-left:auto}
.trg .ch{color:var(--mut)}.trg .ch svg{width:15px;height:15px}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 10px}
.qt button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;color:var(--fg);font-weight:600}
.qt i{width:52px;height:52px;border-radius:50%;border:1px solid var(--bd);background:var(--gs);display:flex;align-items:center;justify-content:center;color:var(--pri);transition:transform .3s var(--e2)}
.qt button:active i{transform:scale(.9)}
.sect{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.sect h2{margin:0;font-size:15px}
.lnk{color:var(--pri);font-weight:700;padding:8px;font-size:12.5px}
.tx{display:flex;gap:11px;align-items:center;width:100%;border-bottom:1px solid var(--ln);padding:12px 0;text-align:left;color:inherit}
.tx:last-child{border-bottom:0}
.tx i{width:40px;height:40px;border-radius:50%;background:var(--gd);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pri)}
.tx .info{flex:1;min-width:0}
.tx strong{display:block;font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
.tx small{display:block;overflow-wrap:anywhere}
.tx b{font-size:13.5px;white-space:nowrap;font-weight:800;color:var(--mut)}
.tx b.in{color:var(--ok)}
.btn{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--bd);background:var(--gs);font-weight:700;padding:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.btn.teal{background:var(--gr);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(0,168,168,.35)}
.btn.dan{background:linear-gradient(135deg,#f87171,#dc2656);color:#fff;border-color:transparent}
.btn.gh{background:transparent;border-color:var(--ln)}
.btn.gold{background:var(--grg);color:#3a2800;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.tile{border:1px solid var(--bd);background:var(--gd);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;color:var(--fg);position:relative;overflow:hidden;transition:transform .25s var(--e2),border-color .25s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--teal));opacity:0;transition:opacity .3s}
.tile:active::before{opacity:1}
.tile i{width:40px;height:40px;border-radius:12px;background:var(--gd);display:flex;align-items:center;justify-content:center;color:var(--pri)}
.tile strong{font-size:13.5px}
.tile small{font-size:11px}
.field{display:block;margin:14px 0}
.field>span{display:block;margin-bottom:7px;font-size:12.5px;color:var(--mut);font-weight:600}
.err{color:var(--err);font-size:12.5px;min-height:1em}
.hint{padding:11px 13px;background:var(--gd);border-radius:12px;font-size:11.5px;line-height:1.7;color:var(--mut);margin:14px 0}
.cap{font-size:11px;text-align:center;color:var(--mut);margin:16px 0}
.back{margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.back .ti{font-weight:700;font-size:14.5px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;direction:ltr;margin:16px 0}
.k{font-size:22px;background:var(--gs);border:1px solid var(--bd);border-radius:16px;min-height:56px;font-weight:600;color:var(--fg);position:relative;overflow:hidden}
.k:active{transform:scale(.9);background:rgba(13,110,253,.18)}
.k::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(0,168,168,.3) 0%,transparent 70%);opacity:0;transform:scale(0)}
.k:active::after{opacity:1;transform:scale(2.5);transition:transform .6s,opacity .6s}
.am{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:10px 0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;transition:transform .2s var(--e2)}
.am.bump{transform:scale(1.04)}
.dt{margin:0}
.detail{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(0,1.3fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:12.5px;line-height:1.7}
.detail:last-child{border-bottom:0}
.detail dt{color:var(--mut);font-weight:600}
.detail dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}
.ml{display:flex;flex-direction:column;gap:2px}
.mi{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--ln);width:100%;text-align:left;color:var(--fg);font-size:13.5px;font-weight:600;min-height:50px}
.mi:last-child{border-bottom:0}
.mi i{width:36px;height:36px;border-radius:11px;background:var(--gd);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi i svg{width:17px;height:17px}
.mi .mt{flex:1;min-width:0}
.mi .mt small{display:block;font-weight:500;margin-top:2px}
.mi .ch{color:var(--mut)}.mi .ch svg{width:15px;height:15px}
.otp{width:72px;height:72px;margin:6px auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--gr);box-shadow:0 14px 32px rgba(0,168,168,.35);animation:pin .6s var(--e2)}
@keyframes pin{from{transform:scale(.4) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.otp svg{width:32px;height:32px}
.boxes{display:flex;justify-content:center;gap:9px;margin:22px 0 12px;direction:ltr}
.box{width:44px;height:56px;border-radius:12px;border:1.5px solid var(--ln);background:var(--gd);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;transition:all .25s var(--e2)}
.box.f{border-color:var(--teal);background:rgba(0,168,168,.1);animation:po .3s var(--e2)}
@keyframes po{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.box.a{border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,168,168,.18)}
.box.e{border-color:var(--err);background:rgba(239,68,68,.08);animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rs{text-align:center;font-size:12.5px;color:var(--mut);margin:6px 0 0}
.rs b{color:var(--teal)}
.opn{display:inline-flex;align-items:center;gap:6px;background:var(--gd);padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.proc{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0a2647 0%,#051020 60%,#000 100%);display:flex;align-items:center;justify-content:center}
.ring{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(0,212,212,.12);stroke-width:4;fill:none}
.ring .fil{stroke:url(#g);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:690;stroke-dashoffset:690;transition:stroke-dashoffset .3s}
.core{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,212,212,.95),rgba(0,122,122,.5) 70%);animation:cp 2s ease-in-out infinite;box-shadow:0 0 60px rgba(0,212,212,.6);display:flex;align-items:center;justify-content:center;color:#fff}
.core svg{width:50px;height:50px}
@keyframes cp{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.08);opacity:1}}
.par{position:absolute;inset:0;pointer-events:none}
.par span{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:radial-gradient(circle,#00d4d4,transparent 70%);opacity:0;animation:po2 3s linear infinite}
@keyframes po2{0%{opacity:0;transform:rotate(0deg) translateX(110px) scale(.5)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:rotate(360deg) translateX(110px) scale(.5)}}
.chk{width:88px;height:88px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(140deg,#34d399,#10b981);color:#fff;margin:10px auto 16px;box-shadow:0 14px 36px rgba(16,185,129,.4);animation:cp2 .7s var(--e2)}
@keyframes cp2{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.chk svg{width:46px;height:46px;stroke-width:3}
.rh{background:linear-gradient(135deg,#0a2647 0%,#134d7a 50%,#0d6efd 100%);border-radius:18px;padding:24px 18px;color:#fff;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.rh::after{content:"";position:absolute;top:-50%;right:-30%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,212,.35),transparent 70%)}
.rh .em{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.rh .em svg{width:30px;height:30px;stroke:#fff;stroke-width:2.4}
.rh .ttl{font-size:14px;font-weight:800;position:relative;z-index:1;letter-spacing:.3px}
.rh .sub{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:2px;position:relative;z-index:1}
.rh .amt{font-size:36px;font-weight:800;letter-spacing:-1.2px;margin-top:14px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.rh .amt small{font-size:14px;opacity:.85}
.rh .xof{font-size:15px;font-weight:700;color:#6ee7e7;margin-top:2px;position:relative;z-index:1}
/* QR Code placeholder */
.qr{width:100px;height:100px;margin:14px auto 0;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.qr svg{width:80px;height:80px;stroke:#000}
.sb{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;text-transform:uppercase}
.sb.p{background:rgba(245,158,11,.15);color:#f59e0b}
.sb.c{background:rgba(16,185,129,.15);color:#10b981}
.sb.f{background:rgba(239,68,68,.15);color:#ef4444}
.sb svg{width:11px;height:11px}
.bnr{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;max-width:470px;margin:0 auto;z-index:99999;background:rgba(28,32,44,.9);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:22px;padding:14px 16px;display:flex;gap:12px;box-shadow:0 14px 50px rgba(0,0,0,.4);transform:translateY(-160%);opacity:0;transition:transform .55s var(--e1),opacity .3s;pointer-events:none;cursor:pointer}
html[data-theme="light"] .bnr{background:rgba(250,250,252,.92)}
.bnr.sh{transform:translateY(0);opacity:1;pointer-events:auto}
.bnr:active{transform:translateY(0) scale(.98)}
.bnr i{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--gr);color:#fff;box-shadow:0 3px 10px rgba(0,168,168,.35)}
.bnr i.ok{background:linear-gradient(140deg,#34d399,#10b981)}
.bnr i.wn{background:linear-gradient(140deg,#fbbf24,#f59e0b)}
.bnr i svg{width:22px;height:22px;stroke-width:2.4}
.bnr .bd{flex:1;min-width:0}
.bnr .hd{display:flex;justify-content:space-between;margin-bottom:3px}
.bnr .ap{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.5px}
html[data-theme="light"] .bnr .ap{color:rgba(60,60,67,.55)}
.bnr .tm{font-size:10.5px;color:rgba(255,255,255,.45)}
.bnr .ttl{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px}
html[data-theme="light"] .bnr .ttl{color:#0a1628}
.bnr .bdy{font-size:13px;color:rgba(255,255,255,.85);line-height:1.4}
html[data-theme="light"] .bnr .bdy{color:#5a7186}
.sw{width:50px;height:29px;border-radius:999px;background:rgba(13,110,253,.2);position:relative;flex-shrink:0;transition:background .3s}

/* ---------- STATS ---------- */
function monthStats(){
  var now = new Date();
  var mk = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  var inAmt = 0, outAmt = 0;
  for (var i=0; i<state.txs.length; i++){
    var x = state.txs[i];
    var d = new Date(x.at);
    var k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    if (k === mk){
      if (x.dir === "in") inAmt += x.amt;
      else outAmt += x.amt;
    }
  }
  return { inAmt: inAmt, outAmt: outAmt };
}

function last6Months(){
  var arr = [];
  var now = new Date();
  for (var i=5; i>=0; i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    var total = 0;
    for (var j=0; j<state.txs.length; j++){
      var x = state.txs[j];
      var xd = new Date(x.at);
      var xk = xd.getFullYear() + "-" + String(xd.getMonth()+1).padStart(2,"0");
      if (xk === k && x.dir === "out") total += x.amt;
    }
    var lbl = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"][d.getMonth()];
    arr.push({ lbl: lbl, total: total });
  }
  return arr;
}

function recentRecipients(){
  var seen = {};
  var arr = [];
  for (var i=0; i<state.txs.length && arr.length<8; i++){
    var x = state.txs[i];
    if (x.dir !== "out") continue;
    if (seen[x.name]) continue;
    seen[x.name] = true;
    arr.push(x);
  }
  return arr;
}

function chartHTML(){

  for (var i=0; i<m.length; i++) if (m[i].total > max) max = m[i].total;

  for (var j=0; j<m.length; j++){
    var h = Math.max(4, (m[j].total/max)*60);
    html += '<div class="cb"><div class="bar" style="height:'+h+'px;animation-delay:'+(j*0.05)+'s"></div><small>'+esc(m[j].lbl)+'</small></div>';

}

function vHistory(){

/* ---------- PROCESSING ---------- */
function startProc(){
  pStart = Date.now();
  clearInterval(pTimer);
  pTimer = setInterval(function(){
    var l = Math.min(1, (Date.now() - pStart) / CFG.PROC_MS);
    var el = $("#ringFill");
    if (el) el.style.strokeDashoffset = String(690 * (1 - l));
    if (l >= 1){ clearInterval(pTimer); finishProc(); }
  }, 60);
}

function finishProc(){
  if (!iDraft){ go("home"); return; }
  var isI = !iDraft.isLocal;
  var c = isI ? findC(iDraft.country) : null;
  var p = isI ? findP(iDraft.provider) : null;
  var ref = genRef();
  var b = iDraft.amt;
  var tot = isI ? b + 3000 : b;
  var t = {
    id: ref, at: Date.now(),
    name: isI ? iDraft.name : iDraft.recipient.name,
    dest: isI ? iDraft.phone : ("+968 "+iDraft.recipient.number),
    kind: isI ? p.name : "Transfert local",
    amt: tot, dir: "out",
    status: state.autoSend ? "DONE" : "PENDING",
    isIntl: isI,
    country: isI ? c.code : null,
    iService: isI ? p.name : null,
    iOrig: isI ? b : null,
    iXOF: isI ? Math.round((b/1000)*FX.rate) : null,
    iRate: isI ? FX.rate : null,
    iFees: isI ? 3000 : 0,
    iPhone: isI ? iDraft.phone : null
  };
  if (state.autoSend){
    state.txs.unshift(t);
    state.bal -= tot;
    state.notifs.unshift({ id:"n"+Date.now(), title: isI ? "Transfert international réussi" : "Transfert réussi", body: money(isI?b:tot)+" OMR · "+t.name, at: Date.now(), read: false });
  } else {
    state.pending.unshift(t);
    state.notifs.unshift({ id:"n"+Date.now(), title: T("pending"), body: money(isI?b:tot)+" OMR · "+t.name, at: Date.now(), read: false });
  }
  save();
  tx = t;
  iDraft = null; raw = ""; iRaw = ""; iOtp = ""; draft = null;
  go("receipt");
  setTimeout(function(){
    if (state.autoSend) banner("Transfert envoyé", "Votre transfert a été effectué avec succès", { success:true, action:function(){ go("receipt"); } });
    else banner(T("pending"), T("autosub"), { warning:true, action:function(){ go("pending"); } });
  }, 900);
}

/* ---------- ACTIONS ---------- */
function act(a, prm){
  switch(a){
    case "bio":
      showLoad();
      setTimeout(function(){
        hideLoad();
        logged = true;
        saveSession();
        go("home");
      }, 900);
      break;
    case "sendReset":
      var e = $("#fEmail");
      if (!e || !e.value){ toast(T("required")); return; }
      showLoad();
      setTimeout(function(){ hideLoad(); toast(T("mailSent")); go("login"); }, 900);
      break;
    case "hide":
      state.hidden = !state.hidden;
      hpt();
      var bv = $("#balView");
      if (bv){ bv.classList.add("hid"); setTimeout(draw, 120); } else draw();
      break;
    case "soon": toast("Fonction bientôt disponible."); break;
    case "startLocal":
      draft = { kind:"local" };
      raw = "";
      go("recipient");
      break;
    case "reviewLocal": go("review"); break;
    case "confirmLocal":
      var b = parseAmt(raw);
      if (!b || b <= 0){ toast(T("invalidAmt")); return; }
      if (b > state.bal){ toast(T("insuffBal")); return; }
      iDraft = { isLocal:true, amt:b, recipient:draft };
      go("processing");
      break;
    case "iContinue":
      var ib = parseAmt(iRaw);
      if (!ib || ib <= 0){ toast(T("invalidAmt")); return; }
      if (ib + 3000 > state.bal){ toast(T("insuffBal")); return; }
      iDraft.amt = ib;
      go("iReview");
      break;
    case "iConfirm":
      iOtp = ""; iOtpErr = false;
      if (rTimer){ clearInterval(rTimer); rTimer = null; }
      startResendTimer();
      go("iOtp");
      break;
    case "resend": toast("Code renvoyé (démo)."); startResendTimer(); break;
    case "langPick": openM("langPick"); break;
    case "setLang": state.lang = prm; save(); closeM(); draw(); break;
    case "themePick": openM("themePick"); break;
    case "setTheme": state.theme = prm; save(); closeM(); draw(); break;
    case "tglAuto":
      state.autoSend = !state.autoSend;
      save();
      toast(state.autoSend ? "Envoi automatique activé" : "Mode en attente activé");
      draw();
      break;
    case "validPend":
      var p2 = null;
      for (var i=0;i<state.pending.length;i++) if (state.pending[i].id === prm){ p2 = state.pending[i]; break; }
      if (p2){
        state.pending = state.pending.filter(function(x){ return x.id !== prm; });
        p2.status = "DONE";
        state.bal -= p2.amt;
        state.txs.unshift(p2);
        save();
        tx = p2;
        toast("Transfert validé");
        banner("Transfert envoyé", "Votre transfert a été effectué", { success:true, action:function(){ go("receipt"); } });
        draw();
      }
      break;
    case "cancelPend":
      state.pending = state.pending.filter(function(x){ return x.id !== prm; });
      save();
      toast("Transfert annulé");
      draw();
      break;
    case "addCard":
      if (state.cards.length >= 5){ toast("Maximum 5 cartes"); return; }
      state.cards.push({ id:"c"+Date.now(), last4: String(Math.floor(1000+Math.random()*9000)), exp:"05/28", type:"VISA", isDef:false });
      save(); toast(T("addcard")); draw();
      break;
    case "rmCard":
      if (!confirm(T("removeCfm"))) return;
      state.cards = state.cards.filter(function(c){ return c.id !== prm; });
      if (!state.cards.length) state.cards = JSON.parse(JSON.stringify(DEF.cards));
      else if (!state.cards.some(function(c){ return c.isDef; })) state.cards[0].isDef = true;
      save(); draw();
      break;
    case "setDef":
      state.cards.forEach(function(c){ c.isDef = (c.id === prm); });
      save(); draw();
      break;
    case "cardFull":
      param = prm;
      openM("cardFull");
      break;
    case "startKyc":
      showLoad();
      setTimeout(function(){
        state.kyc = true;
        save();
        hideLoad();
        draw();
        banner("KYC", T("kycDone"), { success:true });
      }, 1200);
      break;
    case "pickAv": document.getElementById("avatarInput").click(); break;
    case "saveP": save(); toast(T("saved")); go("profile"); break;
    case "shareRx":
      if (tx && navigator.share) navigator.share({ title:"Nizwa", text: T("ref")+": "+tx.id }).catch(function(){});
      else if (tx) copyText(tx.id);
      break;
    case "dlRx":
      if (tx){
        var txt = "Nizwa — "+tx.id+"\n"+when(tx.at)+"\n"+money(tx.amt)+" OMR\n"+tx.name;
        var blob = new Blob([txt], { type:"text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a2 = document.createElement("a");
        a2.href = url; a2.download = "receipt-"+tx.id+".txt";
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      }
      break;
    case "printRx":
      if (tx){
        $("#printArea").innerHTML = '<div style="padding:24px;font-family:system-ui"><h1>Nizwa</h1><h2>'+T("receipt")+' '+esc(tx.id)+'</h2>'+rows([[T("amount"),money(tx.amt)+" OMR"],[T("recipient"),tx.name],[T("date"),when(tx.at)]])+'</div>';
        setTimeout(function(){ window.print(); }, 80);
      }
      break;
    case "copyRef":
      if (tx) copyText(tx.id);
      break;
    case "addFav":
      if (prm && state.favorites.indexOf(prm) === -1){
        state.favorites.push(prm);
        save();
        toast("Ajouté aux favoris");
      } else if (prm) {
        toast("Déjà en favoris");
      }
      break;
    case "rmFav":
      state.favorites = state.favorites.filter(function(n){ return n !== prm; });
      save();
      toast("Retiré des favoris");
      draw();
      break;
    case "quickSend":
      if (!prm) return;
      var bFound = null;
      for (var bi=0; bi<state.txs.length; bi++){
        if (state.txs[bi].name === prm && state.txs[bi].dir === "out"){
          bFound = state.txs[bi]; break;
        }
      }
      if (!bFound){ toast("Bénéficiaire introuvable"); return; }
      draft = { kind:"local", number: (bFound.dest||"").replace(/\D/g,"").slice(-8), name: bFound.name };
      raw = "";
      go("amount");
      break;
    case "logout":
      logged = false;
      clearSession();
      draft = null; iDraft = null; tx = null;
      go("login");
      break;
    case "copyCard":
      copyText("4000 1234 5678 " + (state.cards[0] ? state.cards[0].last4 : ""));
      break;
  }
}

/* ---------- COPY ---------- */
function copyText(s){
  try {
    if (navigator.clipboard){
      navigator.clipboard.writeText(s);
      toast(T("copied"));
      return;
    }
  } catch(e){}
  var ta = document.createElement("textarea");
  ta.value = s;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); toast(T("copied")); } catch(x){ toast(s); }
  ta.remove();
}

function openTx(ref){
  for (var i=0;i<state.txs.length;i++) if (state.txs[i].id === ref){ mtx = state.txs[i]; openM("tx"); return; }
  for (var j=0;j<state.pending.length;j++) if (state.pending[j].id === ref){ mtx = state.pending[j]; openM("tx"); return; }
}

/* ---------- KEYPAD HANDLERS ---------- */
function pressK(k){
  if (k === "⌫") raw = raw.length > 0 ? raw.slice(0,-1) : "";
  else if (k === "."){ if (raw.indexOf(".") >= 0) return; raw = (raw||"0")+"."; }
  else if (/^\d$/.test(k)){
    var p = raw.split(".");
    if (p[1] && p[1].length >= 3) return;
    if (raw === "0") raw = k;
    else if (raw.length < 11) raw += k;
  }
  hpt();
  var el = $("#amtVal");
  if (el){ el.textContent = raw === "" ? "0" : raw; }
  var wrap = $("#amWrap");
  if (wrap){ wrap.classList.add("bump"); setTimeout(function(){ wrap.classList.remove("bump"); }, 200); }
}
function updAmount(){
  var el = $("#amtVal");
  if (el) el.textContent = raw === "" ? "0" : raw;
}

function pressIK(k){
  if (k === "⌫") iRaw = iRaw.length > 0 ? iRaw.slice(0,-1) : "";
  else if (k === "."){ if (iRaw.indexOf(".") >= 0) return; iRaw = (iRaw||"0")+"."; }
  else if (/^\d$/.test(k)){
    var p = iRaw.split(".");
    if (p[1] && p[1].length >= 3) return;
    if (iRaw === "0") iRaw = k;
    else if (iRaw.length < 11) iRaw += k;
  }
  hpt();
  updIAmount();
}

function updIAmount(){
  var c = findC(iDraft.country);
  if (!c) return;
  var b = parseAmt(iRaw) || 0;
  var recv = Math.round((b/1000) * FX.rate);
  var s1 = $("#iSend"); if (s1){ s1.textContent = (iRaw === "" ? "0" : iRaw) + " OMR"; s1.classList.add("bump"); setTimeout(function(){ s1.classList.remove("bump"); }, 250); }
  var s2 = $("#iRecv"); if (s2){ s2.textContent = num(recv) + " " + c.cur; s2.classList.add("bump"); setTimeout(function(){ s2.classList.remove("bump"); }, 250); }
  var s3 = $("#iTotal"); if (s3) s3.textContent = money(b + 3000) + " OMR";
}

function startQT(){
  clearInterval(window._qt);
  var end = Date.now() + 60000;
  window._qt = setInterval(function(){
    var el = $("#qTimer");
    if (!el) return;
    var r = Math.max(0, Math.ceil((end - Date.now())/1000));
    el.textContent = r + "s";
    if (r <= 0){ clearInterval(window._qt); toast(T("invalidAmt")); }
  }, 1000);
}

function pressIOtp(k){
  if (iOtpErr){ iOtp = ""; iOtpErr = false; }
  if (k === "⌫") iOtp = iOtp.slice(0,-1);
  else if (/^\d$/.test(k)){ if (iOtp.length < 6) iOtp += k; }
  hpt();
  if (iOtp.length === 6){
    var captured = iOtp;
    draw();
    setTimeout(function(){
      if (iOtp !== captured) return;
      if (captured === CFG.DEMO_CODE){
        var b = iDraft.amt;
        var tot = b + 3000;
        if (tot > state.bal){ toast(T("insuffBal")); go("iAmount"); return; }
        go("processing");
      } else {
        iOtpErr = true;
        draw();
        setTimeout(function(){ iOtp = ""; iOtpErr = false; draw(); }, 900);
      }
    }, 180);
  } else draw();
}

/* ---------- AVATAR UPLOAD ---------- */
var avi = document.getElementById("avatarInput");
if (avi){
  avi.addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(ev){
      state.avatar = ev.target.result;
      save();
      draw();
      banner("Photo mise à jour", "", { success:true });
    };
    r.readAsDataURL(f);
  });
}

/* ---------- KEYBOARD ---------- */
document.addEventListener("keydown", function(e){
  if (page === "iOtp"){
    if (/^\d$/.test(e.key)){ e.preventDefault(); pressIOtp(e.key); }
    else if (e.key === "Backspace"){ e.preventDefault(); pressIOtp("⌫"); }
  }
});

/* ---------- MODAL CANCEL ---------- */
modal.addEventListener("cancel", function(e){ e.preventDefault(); closeM(); });

/* ---------- INIT ---------- */
draw();
setTimeout(function(){
  var sp = document.getElementById("splash");
  if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
  if (hasSession()){
    logged = true;
    go("home");
  }
}, 3100);

})();
</script>
</body>
